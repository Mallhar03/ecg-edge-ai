project:
  name: "ecg-edge-accelerator"
  seed: 42
  output_dir: "software/outputs"
  log_dir: "software/outputs/logs"

data:
  raw_dir: "software/data/raw"
  processed_dir: "software/data/processed"
  physionet_db: "mitdb"
  sample_rate: 360
  window_size: 256
  lead_index: 0
  in_channels: 2  # Set to 2 for dual-lead (MLII + V1)

  # Inter-patient split following Chazal et al. 2004 (AAMI standard).
  # Records 102, 104, 107, 217 are excluded as mandated by AAMI EC57 (pacemaker rhythms).
  # DS1: 22 records used for training and validation.
  train_records:
    - "101"
    - "106"
    - "108"
    - "109"
    - "112"
    - "114"
    - "115"
    - "116"
    - "118"
    - "119"
    - "122"
    - "124"
    - "201"
    - "203"
    - "205"
    - "207"
    - "208"
    - "209"
    - "215"
    - "220"
    - "223"
    - "230"

  # DS2: 22 records used exclusively for independent test evaluation.
  test_records:
    - "100"
    - "103"
    - "105"
    - "111"
    - "113"
    - "117"
    - "121"
    - "123"
    - "200"
    - "202"
    - "210"
    - "212"
    - "213"
    - "214"
    - "219"
    - "221"
    - "222"
    - "228"
    - "231"
    - "232"
    - "233"
    - "234"

  val_split_fraction: 0.15

  # AAMI EC57-standard annotation mapping (revised for scientific correctness).
  # Every beat in the MIT-BIH database is mapped — NO silent Normal fallback.
  #
  # Previous mapping had 3 critical bugs:
  #   1. "QT_interval" class was fictional (MIT-BIH doesn't annotate QT intervals)
  #   2. V (PVC, 7130 beats) and / (paced, 7028 beats) were silently labeled Normal
  #   3. ST_segment had only ~85 beats — statistically meaningless
  #
  # New mapping aligns with AAMI EC57 groups:
  #   N (Normal): Normal sinus rhythm
  #   S (Supraventricular): Atrial/junctional ectopy
  #   V (Ventricular): PVCs and fusion beats — most dangerous arrhythmias
  #   F (Bundle Branch Block): Conduction disease
  #   Q (Paced/Other): Pacemaker rhythms + unclassifiable
  annotation_map:
    Supraventricular:    ["A", "a", "J", "S", "e", "j"]
    Ventricular:         ["V", "F"]
    Bundle_Branch_Block: ["L", "R"]
    Paced_Other:         ["!", "/", "f", "Q"]
    Normal:              ["N", "."]

  # REVISED class order. Index positions for hardware RTL.
  # [0]=Supraventricular [1]=Ventricular [2]=Bundle_Branch_Block [3]=Paced_Other [4]=Normal
  class_names:
    - "Supraventricular"
    - "Ventricular"
    - "Bundle_Branch_Block"
    - "Paced_Other"
    - "Normal"

  # Data augmentation settings
  augmentation:
    enabled: true
    time_shift_samples: 10        # Random shift ±10 samples
    amplitude_scale_range: 0.1    # ±10% amplitude scaling
    gaussian_noise_std: 0.01      # Additive Gaussian noise σ=0.01

  # Annotation matching: search_radius in samples around each R-peak.
  # Increased from 5→12 to match known XQRS jitter (20-30ms at 360 Hz = 7-11 samples).
  search_radius: 12

model:
  branch_out_channels: 32
  kernel_sizes: [3, 5, 7]
  pool_output_size: 16
  fc_hidden_size: 64
  dropout_rate: 0.3
  num_classes: 5
  # Use Squeeze-and-Excitation attention in each branch
  use_se_attention: true
  se_reduction: 4
  use_rr_features: true
  # Clinical severity weights: higher = rarer/more dangerous condition.
  # Supraventricular(2.0)=pre-AF, Ventricular(2.5)=sudden death risk,
  # BBB(1.5)=conduction disease, Paced_Other(1.0)=device rhythm, Normal(1.0)=baseline
  class_weights: [2.0, 2.5, 1.5, 1.0, 1.0]

training:
  epochs: 25
  batch_size: 128
  learning_rate: 0.001
  optimizer: "adam"
  weight_decay: 0.0005
  checkpoint_every_n_epochs: 5
  early_stopping_patience: 10
  num_workers: 0
  pin_memory: false
  balanced_sampling: true
  # Loss function: "focal" or "bce"
  loss_type: "focal"
  focal_gamma: 2.0
  # Learning rate scheduler: "cosine", "plateau", or "none"
  lr_scheduler: "cosine"
  lr_scheduler_min_lr: 0.00001

qat:
  epochs: 5
  lr: 0.0001
  batch_size: 64
  calibration_batches: 50
  weight_bits: 8
  activation_bits: 8
  max_sensitivity_drop_pct: 5.0

export:
  output_dir: "software/outputs/mem_files"

inference:
  simulation_mode: true
  threshold: 0.5
  window_size: 256
  # Per-class threshold optimization (computed on validation set)
  optimize_thresholds: true
